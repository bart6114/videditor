app = "videditor-app"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.app"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 1
  processes = ["app"]
  [http_service.concurrency]
    hard_limit = 100
    soft_limit = 75

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  count = 1
