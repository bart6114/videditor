app = "videditor-jobs"
primary_region = "ams"

# Allow 5 minutes for graceful shutdown so running jobs can complete
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile.jobs"

[env]
  NODE_ENV = "production"
  PORT = "8081"

[http_service]
  internal_port = 8081
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"

[metrics]
  port = 8081
  path = "/metrics/"
